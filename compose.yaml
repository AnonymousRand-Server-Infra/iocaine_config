include:
  - ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_UTILS:?}/shared_sckts.yaml

services:
  iocaine:
    container_name: iocaine
    extends:
      file: ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_UTILS:?}/shared_sckts.yaml
      service: shared_sckts_user
    profiles:
      - ${DOCKER_DEFAULT_PROFILE:?}
    build:
      # note that dockerfile cannot access directories above this
      context: ${PATH_TO_SERVER_ROOT:?}
      dockerfile: ${PATH_FROM_ROOT_TO_IOCAINE:?}/Dockerfile
      args:
        CPU_ARCH: ${CPU_ARCH:?}
        DOCKER_ROOT_USER: ${DOCKER_ROOT_USER:?}
        DOCKER_NONROOT_USER: ${DOCKER_NONROOT_USER:?}
        IOCAINE_CONFIG_SRC_FILES: ${IOCAINE_CONFIG_SRC_FILES:?}
        IOCAINE_CONFIG_DEST_DIR: ${IOCAINE_CONFIG_DEST_DIR:?}
        IOCAINE_RUN_DEST_DIR: ${IOCAINE_RUN_DEST_DIR:?}
        PATH_FROM_ROOT_TO_IOCAINE: ${PATH_FROM_ROOT_TO_IOCAINE:?}
    restart: unless-stopped
    user: ${DOCKER_NONROOT_USER:?}
    # SYNC: config path inside container
    command: --config-path ${IOCAINE_CONFIG_DEST_DIR:?}/config.d/
    volumes:
      # container-generated data
      - type: volume
        source: iocaine_run
        target: ${IOCAINE_RUN_DEST_DIR:?}
    env_file:
      # for `envsubst`
      # i don't think there's a way to store a dynamic list in an env var, hence this bullshit
      # make sure this accommodates all the files you need, and keep an `.empty.env` as a fallback
      - ${ENVSUBST_ENV_FILE_1:-.empty.env}
      - ${ENVSUBST_ENV_FILE_2:-.empty.env}
    environment:
      RUST_LOG: iocaine=info
    # the docker image is too minimal to support any healthchecking; use `service_started` instead

volumes:
  iocaine_run:
